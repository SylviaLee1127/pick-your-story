<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tap Town</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏘️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky: #BFE6FF;
      --grass: #7CCB6B;
      --ink: #1F2A5A;
      --paper: #FFFDF5;
      --sun: #FFD23F;
      --berry: #E8457A;
      --leaf: #2E9E5B;
      --go: #22A45D;
      --muted: #C9CCD9;
      --shadow: #1F2A5A;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --sky: #1B2450;
        --grass: #2F6B3A;
        --ink: #FFF6D6;
        --paper: #26306A;
        --sun: #F5C52E;
        --berry: #F06292;
        --leaf: #43B66F;
        --go: #34C474;
        --muted: #4A5385;
        --shadow: #0A0F2A;
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }

    body {
      font-family: "Baloo 2", "Comic Sans MS", "Chalkboard SE", "Trebuchet MS", sans-serif;
      color: var(--ink);
      background: linear-gradient(to bottom, var(--sky) 0%, var(--sky) 72%, var(--grass) 72%, var(--grass) 100%);
      background-attachment: fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    }

    main {
      width: 100%;
      max-width: 620px;
      background: var(--paper);
      border: 4px solid var(--ink);
      border-radius: 28px;
      box-shadow: 8px 8px 0 var(--shadow);
      padding: 22px 22px 28px;
      text-align: center;
    }

    h1 {
      font-size: clamp(34px, 9vw, 48px);
      font-weight: 800;
      line-height: 1.05;
      margin: 4px 0 6px;
    }
    .hint {
      font-size: clamp(20px, 5vw, 24px);
      font-weight: 700;
      margin: 0 0 20px;
    }

    /* ---------- Things you can pick (stories and choices) ---------- */
    .pick {
      position: relative;
      font: inherit;
      color: #1F2A5A;
      border: 4px solid var(--ink);
      border-radius: 20px;
      box-shadow: 0 6px 0 var(--shadow);
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s, opacity 0.15s;
    }
    .pick:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--shadow); }

    /* When one thing is picked, the others fade a little */
    .has-pick .pick:not(.picked) { opacity: 0.55; }

    .pick.picked {
      transform: scale(1.03);
      outline: 6px solid var(--go);
      outline-offset: 3px;
    }
    .pick.picked::after {
      content: "✔";
      position: absolute;
      top: -16px;
      right: -14px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--go);
      color: #fff;
      border: 3px solid var(--ink);
      font-size: 24px;
      line-height: 34px;
      font-weight: 800;
    }

    /* Story picker */
    #shelf {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 18px;
    }
    .book {
      padding: 14px 10px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .book .icon { font-size: 56px; line-height: 1.1; }
    .book .name { font-size: 22px; font-weight: 800; line-height: 1.15; }

    /* Choices inside a story */
    #choices { display: grid; gap: 16px; }
    .choice {
      font-size: clamp(20px, 5vw, 24px);
      font-weight: 800;
      background: var(--sun);
      padding: 14px 18px;
      min-height: 72px;
    }
    .choice:nth-child(2) { background: #8FD3FF; }
    .choice:nth-child(3) { background: #FFB3C9; }

    /* The big checkmark button that confirms */
    .go {
      font: inherit;
      width: 100%;
      margin-top: 22px;
      font-size: clamp(24px, 6vw, 30px);
      font-weight: 800;
      color: #fff;
      background: var(--go);
      border: 4px solid var(--ink);
      border-radius: 999px;
      box-shadow: 0 6px 0 var(--shadow);
      padding: 12px 18px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .go:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--shadow); }
    .go:disabled {
      background: var(--muted);
      color: var(--ink);
      opacity: 0.7;
      cursor: default;
      box-shadow: none;
      transform: none;
    }
    .go.ready { animation: wiggle 0.5s ease-in-out; }
    @keyframes wiggle {
      0%, 100% { transform: rotate(0); }
      25% { transform: rotate(-2deg) scale(1.03); }
      75% { transform: rotate(2deg) scale(1.03); }
    }

    /* Story screen */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .small-btn {
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      border: 3px solid var(--ink);
      border-radius: 999px;
      padding: 6px 16px;
      cursor: pointer;
    }
    .back { background: var(--paper); color: var(--ink); }
    .read { background: var(--leaf); color: #fff; }

    #picture {
      font-size: clamp(72px, 22vw, 120px);
      line-height: 1.1;
      margin: 6px 0 12px;
      user-select: none;
    }
    #picture.pop { animation: pop 0.45s ease-out; }
    @keyframes pop {
      0%   { transform: scale(0.6) rotate(-6deg); opacity: 0; }
      70%  { transform: scale(1.08) rotate(2deg); opacity: 1; }
      100% { transform: scale(1) rotate(0); }
    }

    #text {
      font-size: clamp(22px, 5.5vw, 28px);
      font-weight: 700;
      line-height: 1.35;
      margin: 0 0 22px;
    }

    /* Grown-up voice picker */
    .voice-row {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 3px dashed var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
    }
    .voice-row select {
      font: inherit;
      font-size: 16px;
      max-width: 100%;
      color: var(--ink);
      background: var(--paper);
      border: 3px solid var(--ink);
      border-radius: 12px;
      padding: 4px 8px;
    }

    button:focus-visible { outline: 5px dashed var(--berry); outline-offset: 4px; }
    [hidden] { display: none !important; }

    @media (prefers-reduced-motion: reduce) {
      #picture.pop, .go.ready { animation: none; }
      .pick, .go { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <!-- Story picker screen -->
    <section id="home">
      <h1>🏘️ Tap Town</h1>
      <p class="hint">Pick a story, then tap the ✔ to start!</p>
      <div id="shelf"></div>
      <button class="go" id="homeGo" type="button" disabled>Pick a story first</button>

      <div class="voice-row" id="voiceRow" hidden>
        <label for="voiceSelect">🗣️ Reader voice:</label>
        <select id="voiceSelect"></select>
        <button class="small-btn read" id="voiceTest" type="button">▶ Try it</button>
      </div>
    </section>

    <!-- Story screen -->
    <section id="reader" hidden>
      <div class="topbar">
        <button class="small-btn back" id="backBtn" type="button">📚 Stories</button>
        <button class="small-btn read" id="readBtn" type="button">🔊 Read to me</button>
      </div>
      <div id="picture" aria-hidden="true"></div>
      <p id="text" aria-live="polite"></p>
      <div id="choices"></div>
      <button class="go" id="storyGo" type="button" disabled>Pick one first</button>
    </section>
  </main>

<script>
/*
  HOW TO ADD A STORY
  Copy one of the stories below and change it. Each scene has:
    pic     - emoji for the picture
    text    - what the story says
    choices - [button words, scene to go to]
  A scene with  end: true  is an ending. It gets "Read it again"
  and "Pick another story" buttons automatically.
*/
const stories = {

  /* ===================== MOO FARM ===================== */
  moo: {

    scenes: {
      start: {

      birdtalk: {

      mooback: {
        pic: "🐦😄",

        choices: [["Follow the moo bird", "barn"]]
      },
      dog: {
        pic: "🐶",
        text: "Farmer Fran’s dog, Pickles, runs up. He wags his tail and says… “MOO!”",
        choices: [["Throw him a stick", "stick"], ["Give him a belly rub", "belly"]]

      stick: {
        pic: "🐶🪵",
        text: "You throw a stick. Pickles runs after it yelling “MOO! MOO! MOO!” He drops it by the barn.",
        choices: [["Go to the barn", "barn"]]
      },
      belly: {
        pic: "🐶😆",
        text: "You rub his belly. His leg kicks and he goes “Moo-hoo-hoo!” That’s how a moo dog giggles.",
        choices: [["Go to the barn", "barn"]]
      },
      barn: {
        pic: "🐖🐑🐔",
        text: "In the barn, the pig says “MOO.” The sheep says “MOO.” Even the chicken says “MOO!”",
        choices: [["Look for the cow", "cow"], ["Ask the chicken why", "chicken"]]
      },
      chicken: {
        pic: "🐔👉",
        text: "You ask the chicken, “Why do you moo?” The chicken flaps one wing at a big brown cow.",
        choices: [["Go find the cow", "cow"]]
      },
      cow: {
        pic: "🐄🎶",
        text: "The cow stands on a hay bale. She goes “MOO!” and all the animals copy her. “MOO!” She’s the boss of the band!",

      },
      teach: {
        pic: "🧒🐶",
        text: "You point at Pickles and say “Woof!” Pickles thinks very hard. Then he says… “Woof-moo!”",
        choices: [["Keep trying", "teach2"], ["Give up and laugh", "laugh"]]

      teach2: {
        pic: "🐔🐖🐦",
        text: "The chicken says “Cluck!” The pig says “Oink!” The bird says “Tweet!” Farmer Fran cheers! Then the cow goes “MOO!”… and they ALL say “MOO!” again.",
        end: true
      },
      laugh: {
        pic: "😂🌾",
        text: "You laugh so hard you fall in the hay. Now YOU say “moo” when you laugh. Moo-ha-ha-ha!",
        end: true
      },
      band: {
        pic: "🥁🐄",
        text: "You grab a bucket for a drum. BANG! “MOO!” BANG! “MOO!” It’s the loudest song on the whole farm.",
        choices: [["Take a big bow", "bow"]]
      },
      bow: {
        pic: "👏🐄",
        text: "Farmer Fran claps. “That’s not what I wanted, but it’s GREAT!” You bow. The cow bows. The moo bird falls off the fence.",
        end: true
      }
    }
  },

  /* ===================== BISCUIT ===================== */
  biscuit: {
    title: "Biscuit the Cat-Dog",
    icon: "🐶",
    color: "#FFD23F",
    scenes: {
      start: {
        pic: "🏡🐶",
        text: "Your new puppy, Biscuit, is very silly. He thinks he’s a cat!",
        choices: [["Watch what he does", "box"]]

      box: {

      fish: {

        pic: "💤🐶",

      doorbell: {

      mail: {
        pic: "📬🐱",
        text: "It’s the mail carrier, and her cat came along! The cat looks at Biscuit. Biscuit says, “Meow.” The cat says… “Woof?”",
        end: true
      }
    }
  },

  /* ===================== PANCAKES ===================== */
  pancakes: {

      sorry: {

        text: "Grandpa licks his glasses. “Mmm! Tastes good!” he says. Everyone laughs.",

      },
      pretend: {

      },
      blue: {

        choices: [["Start cooking", "pan"]]
      },
      choc: {
        pic: "🍫🤫",
        text: "You add chocolate chips. You also eat a big handful. Shhh. Don’t tell Grandma.",
        choices: [["Start cooking", "pan"]]
      },
      pan: {

        text: "Grandma pours the batter in the pan. Sizzle, sizzle! Now it’s time to flip it.",
        choices: [["Flip it gently", "gentle"], ["Flip it SUPER high", "high"]]
      },
      gentle: {

        text: "Flip! It lands perfectly. Grandma gives you a high five.",
        choices: [["Make a tall stack", "stack"]]
      },
      high: {

        text: "You flip it so high that it sticks to the ceiling! Everyone looks up. Nobody moves.",
        choices: [["Wait for it…", "drop"]]
      },
      drop: {
        pic: "🥞🐶",

      },
      stack: {

        text: "You make pancake after pancake. The stack gets taller than you! It wobbles…",

      steady: {

  /* ===================== BEACH ===================== */

      },
      silly: {
        pic: "⛄🧦🥄",
        text: "You add sock ears and spoon eyebrows. You name him Mr. Banana Nose.",
        choices: [["Show the neighbors", "neighbors"]]
      },
      neighbors: {
        pic: "👀⛄",
        text: "The kid next door makes a snowman with a pickle nose. Now it’s a silly snowman contest! Mr. Banana Nose wins.",
        choices: [["Go inside to warm up", "cocoa"]]
      },
      sled: {
        pic: "🛷⛰️",
        text: "You pull your sled to the top of the big hill. Which way do you go?",
        choices: [["The steep, fast side", "fast"], ["The easy, slow side", "slow"]]
      },
      fast: {
        pic: "🛷💨",
        text: "WHOOSH! You zoom down super fast… and land head-first in a giant snowbank. Only your boots stick out!",
        choices: [["Wiggle out", "wiggle"]]
      },
      wiggle: {
        pic: "👢❄️",
        text: "You wiggle and wiggle. POP! You come out with snow in your ears, your nose, and your pants. Brrr!",
        choices: [["Go inside to warm up", "cocoa"]]
      },
      slow: {
        pic: "🛷🐢",
        text: "You go down nice and slow. SO slow that a kid passes you. Then a dog passes you. Then Grandpa passes you… walking!",
        choices: [["Try the fast side", "fast"]]
      },
      cocoa: {
        pic: "☕🧦",
        text: "You put on fuzzy socks and drink hot cocoa. A marshmallow sticks to your nose. Now you have a snowman nose too!",
        end: true
      }
    }
  }
};

/* ---------------- Page parts ---------------- */
const home = document.getElementById("home");
const reader = document.getElementById("reader");
const shelf = document.getElementById("shelf");
const homeGo = document.getElementById("homeGo");
const picture = document.getElementById("picture");
const text = document.getElementById("text");
const choices = document.getElementById("choices");
const storyGo = document.getElementById("storyGo");
const readBtn = document.getElementById("readBtn");
const backBtn = document.getElementById("backBtn");

let storyId = null;
let sceneId = "start";
let pickedAction = null;  // what happens when ✔ is tapped

/* ---------------- Reading out loud ----------------
   Browsers come with many voices. Some sound robotic, and some
   (often labelled "Natural", "Neural", "Online", "Enhanced" or
   "Premium") sound like a real person. We pick the most natural
   English one we can find, and a grown-up can change it below
   the story shelf. The choice is remembered on this device.
*/
const canTalk = "speechSynthesis" in window;
const voiceRow = document.getElementById("voiceRow");
const voiceSelect = document.getElementById("voiceSelect");
const voiceTest = document.getElementById("voiceTest");
let voices = [];
let chosenVoice = null;

function voiceScore(v) {
  const name = v.name.toLowerCase();
  let score = 0;
  if (!v.lang.toLowerCase().startsWith("en")) return -100;
  if (/natural|neural|online|enhanced|premium/.test(name)) score += 50;
  if (/aria|jenny|ava|emma|michelle|samantha|allison|zoe|serena|libby|sonia|google us english|google uk english female/.test(name)) score += 20;
  if (/en-us/i.test(v.lang)) score += 5;
  if (v.localService === false) score += 3;
  // Novelty and very robotic voices
  if (/espeak|zarvox|fred|albert|bad news|bells|boing|bubbles|cellos|whisper|wobble|trinoids|jester|organ|superstar|ralph|junior|grandma|grandpa|rocko|shelley|flo|eddy|reed|sandy/.test(name)) score -= 60;
  return score;
}

function loadVoices() {
  if (!canTalk) return;
  voices = window.speechSynthesis.getVoices()
    .filter(v => voiceScore(v) > -50)
    .sort((a, b) => voiceScore(b) - voiceScore(a));
  if (!voices.length) return;

  let saved = null;
  try { saved = localStorage.getItem("readerVoice"); } catch (e) {}
  chosenVoice = voices.find(v => v.name === saved) || voices[0];

  voiceSelect.innerHTML = "";
  voices.forEach(v => {
    const opt = document.createElement("option");
    opt.value = v.name;
    opt.textContent = v.name.replace(/^Microsoft\s|\s-\s.*$/g, "") + " (" + v.lang + ")";
    if (v === chosenVoice) opt.selected = true;
    voiceSelect.appendChild(opt);
  });
  voiceRow.hidden = voices.length < 2;
}

if (canTalk) {
  loadVoices();
  window.speechSynthesis.addEventListener("voiceschanged", loadVoices);
  voiceSelect.addEventListener("change", () => {
    chosenVoice = voices.find(v => v.name === voiceSelect.value) || chosenVoice;
    try { localStorage.setItem("readerVoice", chosenVoice.name); } catch (e) {}
    speak("Hi! This is how I sound when I read your story.");
  });
  voiceTest.addEventListener("click", () => speak("Hi! This is how I sound when I read your story."));
}

function stopTalking() {
  if (canTalk) window.speechSynthesis.cancel();
}

// Speak one sentence at a time, at a normal talking speed.
// Short pieces sound more natural and avoid a browser bug that
// cuts off long speech.
function speak(words) {
  if (!canTalk) return;
  stopTalking();
  const parts = words
    .replace(/[“”]/g, "")
    .replace(/…/g, "...")
    .match(/[^.!?]+[.!?]*(\s|$)/g) || [words];
  parts.map(p => p.trim()).filter(Boolean).forEach(part => {
    const talk = new SpeechSynthesisUtterance(part);
    if (chosenVoice) {
      talk.voice = chosenVoice;
      talk.lang = chosenVoice.lang;
    }
    talk.rate = 1;
    talk.pitch = 1;
    window.speechSynthesis.speak(talk);
  });
}

/* ---------------- Pick, then confirm ---------------- */
function resetPick(group, goBtn, waitingWords) {
  pickedAction = null;
  group.classList.remove("has-pick");
  group.querySelectorAll(".pick").forEach(b => {
    b.classList.remove("picked");
    b.setAttribute("aria-pressed", "false");
  });
  goBtn.disabled = true;
  goBtn.classList.remove("ready");
  goBtn.textContent = waitingWords;
}

function makePickable(btn, group, goBtn, sayWords, action) {
  btn.classList.add("pick");
  btn.type = "button";
  btn.setAttribute("aria-pressed", "false");
  btn.addEventListener("click", () => {
    group.querySelectorAll(".pick").forEach(b => {
      b.classList.remove("picked");
      b.setAttribute("aria-pressed", "false");
    });
    btn.classList.add("picked");
    btn.setAttribute("aria-pressed", "true");
    group.classList.add("has-pick");
    pickedAction = action;
    speak(sayWords);

    goBtn.disabled = false;
    goBtn.textContent = "✔ Go!";
    goBtn.classList.remove("ready");
    void goBtn.offsetWidth;   // restart the wiggle
    goBtn.classList.add("ready");
  });
}

function confirmPick() {
  if (!pickedAction) return;
  stopTalking();
  const action = pickedAction;
  pickedAction = null;
  action();
}
homeGo.addEventListener("click", confirmPick);
storyGo.addEventListener("click", confirmPick);

/* ---------------- Screens ---------------- */
function showHome() {
  stopTalking();
  reader.hidden = true;
  home.hidden = false;
  resetPick(shelf, homeGo, "Pick a story first");
  window.scrollTo(0, 0);
}

function startStory(id) {
  storyId = id;
  home.hidden = true;
  reader.hidden = false;
  showScene("start");
}

function showScene(id) {
  sceneId = id;
  const scene = stories[storyId].scenes[id];

  picture.textContent = scene.pic;
  picture.classList.remove("pop");
  void picture.offsetWidth;   // restart the pop
  picture.classList.add("pop");

  text.textContent = scene.text;

  choices.innerHTML = "";
  const options = scene.end
    ? [["🔁 Read it again", () => showScene("start")], ["📚 Pick another story", showHome]]
    : scene.choices.map(([label, next]) => [label, () => showScene(next)]);

  options.forEach(([label, action]) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.textContent = label;
    makePickable(btn, choices, storyGo, label.replace(/^\S+\s/, m => /\p{Extended_Pictographic}/u.test(m) ? "" : m), action);
    choices.appendChild(btn);
  });

  resetPick(choices, storyGo, "Pick one first");
  window.scrollTo(0, 0);
}

/* ---------------- Build the story shelf ---------------- */
Object.entries(stories).forEach(([id, story]) => {
  const btn = document.createElement("button");
  btn.className = "book";
  btn.style.background = story.color;
  btn.innerHTML = '<span class="icon" aria-hidden="true"></span><span class="name"></span>';
  btn.querySelector(".icon").textContent = story.icon;
  btn.querySelector(".name").textContent = story.title;
  makePickable(btn, shelf, homeGo, story.title, () => startStory(id));
  shelf.appendChild(btn);
});

readBtn.addEventListener("click", () => {
  const scene = stories[storyId].scenes[sceneId];
  if (scene.end) {
    speak(scene.text + " The end!");
  } else if (scene.choices.length === 1) {
    speak(scene.text + " Next: " + scene.choices[0][0] + ".");
  } else {
    const opts = scene.choices.map(c => c[0]);
    const last = opts.pop();
    speak(scene.text + " What will you do? " + opts.join(". ") + ". Or, " + last + ".");
  }
});

backBtn.addEventListener("click", showHome);

if (!canTalk) readBtn.hidden = true;
</script>
</body>
