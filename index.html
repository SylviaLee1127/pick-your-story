<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pick Your Story</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky: #BFE6FF;
      --grass: #7CCB6B;
      --ink: #1F2A5A;
      --paper: #FFFDF5;
      --sun: #FFD23F;
      --berry: #E8457A;
      --leaf: #2E9E5B;
      --shadow: #1F2A5A;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --sky: #1B2450;
        --grass: #2F6B3A;
        --ink: #FFF6D6;
        --paper: #26306A;
        --sun: #F5C52E;
        --berry: #F06292;
        --leaf: #43B66F;
        --shadow: #0A0F2A;
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }

    body {
      font-family: "Baloo 2", "Comic Sans MS", "Chalkboard SE", "Trebuchet MS", sans-serif;
      color: var(--ink);
      background: linear-gradient(to bottom, var(--sky) 0%, var(--sky) 72%, var(--grass) 72%, var(--grass) 100%);
      background-attachment: fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    }

    main {
      width: 100%;
      max-width: 620px;
      background: var(--paper);
      border: 4px solid var(--ink);
      border-radius: 28px;
      box-shadow: 8px 8px 0 var(--shadow);
      padding: 22px 22px 28px;
      text-align: center;
    }

    h1 {
      font-size: clamp(34px, 9vw, 48px);
      font-weight: 800;
      line-height: 1.05;
      margin: 4px 0 6px;
    }
    .hint {
      font-size: clamp(20px, 5vw, 24px);
      font-weight: 700;
      margin: 0 0 20px;
    }

    /* Story picker */
    #shelf {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 16px;
    }
    .book {
      font: inherit;
      color: #1F2A5A;
      border: 4px solid var(--ink);
      border-radius: 20px;
      box-shadow: 0 6px 0 var(--shadow);
      padding: 14px 10px 12px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: transform 0.08s, box-shadow 0.08s;
    }
    .book .icon { font-size: 56px; line-height: 1.1; }
    .book .name { font-size: 22px; font-weight: 800; line-height: 1.15; }
    .book:active { transform: translateY(6px); box-shadow: 0 0 0 var(--shadow); }

    /* Story screen */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .small-btn {
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      border: 3px solid var(--ink);
      border-radius: 999px;
      padding: 6px 16px;
      cursor: pointer;
    }
    .back { background: var(--paper); color: var(--ink); }
    .read { background: var(--leaf); color: #fff; }

    #picture {
      font-size: clamp(72px, 22vw, 120px);
      line-height: 1.1;
      margin: 6px 0 12px;
      user-select: none;
    }
    #picture.pop { animation: pop 0.45s ease-out; }
    @keyframes pop {
      0%   { transform: scale(0.6) rotate(-6deg); opacity: 0; }
      70%  { transform: scale(1.08) rotate(2deg); opacity: 1; }
      100% { transform: scale(1) rotate(0); }
    }

    #text {
      font-size: clamp(22px, 5.5vw, 28px);
      font-weight: 700;
      line-height: 1.35;
      margin: 0 0 22px;
    }

    #choices { display: grid; gap: 14px; }
    .choice {
      font: inherit;
      font-size: clamp(20px, 5vw, 24px);
      font-weight: 800;
      color: #1F2A5A;
      background: var(--sun);
      border: 4px solid var(--ink);
      border-radius: 20px;
      box-shadow: 0 6px 0 var(--shadow);
      padding: 14px 18px;
      min-height: 72px;
      cursor: pointer;
      transition: transform 0.08s, box-shadow 0.08s;
    }
    .choice:nth-child(2) { background: #8FD3FF; }
    .choice:nth-child(3) { background: #FFB3C9; }
    .choice:active { transform: translateY(6px); box-shadow: 0 0 0 var(--shadow); }

    button:focus-visible { outline: 5px dashed var(--berry); outline-offset: 4px; }
    [hidden] { display: none !important; }

    @media (prefers-reduced-motion: reduce) {
      #picture.pop { animation: none; }
      .choice, .book { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <!-- Story picker screen -->
    <section id="home">
      <h1>📚 Pick Your Story</h1>
      <p class="hint">Tap a story to start!</p>
      <div id="shelf"></div>
    </section>

    <!-- Story screen -->
    <section id="reader" hidden>
      <div class="topbar">
        <button class="small-btn back" id="backBtn" type="button">📚 Stories</button>
        <button class="small-btn read" id="readBtn" type="button">🔊 Read to me</button>
      </div>
      <div id="picture" aria-hidden="true"></div>
      <p id="text" aria-live="polite"></p>
      <div id="choices"></div>
    </section>
  </main>

<script>
/*
  HOW TO ADD A STORY
  Copy one of the stories below and change it. Each scene has:
    pic     - emoji for the picture
    text    - what the story says
    choices - [button words, scene to go to]
  A scene with  end: true  is an ending. It gets "Read it again"
  and "Pick another story" buttons automatically.
*/
const stories = {
  cat: {
    title: "Where’s Milo?",
    icon: "🐱",
    color: "#FFD23F",
    scenes: {
      start: {
        pic: "🏡🐱",
        text: "Oh no! Your cat Milo ran out the back door! Where do you look first?",
        choices: [["Look in the garden", "garden"], ["Ask your neighbor", "neighbor"]]
      },
      garden: {
        pic: "🌻🦋",
        text: "You look in the garden. You see flowers and a butterfly, but no Milo.",
        choices: [["Look in the shed", "shed"], ["Shake the treat bag", "treats"]]
      },
      shed: {
        pic: "🔦📦",
        text: "You peek in the shed with a flashlight. Just boxes and an old bike.",
        choices: [["Shake the treat bag", "treats"]]
      },
      treats: {
        pic: "🛍️👂",
        text: "Rattle, rattle! You hear a tiny meow… from up in the tree!",
        choices: [["Get a grown-up", "ladder"], ["Call his name softly", "callname"]]
      },
      ladder: {
        pic: "🪜🐱",
        text: "Milo is stuck in the tree! Mom gets a ladder and carries him down. Phew!",
        end: true
      },
      callname: {
        pic: "🌳🐱",
        text: "You say, “Milo, come down!” He slowly climbs down all by himself. Good kitty!",
        end: true
      },
      neighbor: {
        pic: "👵🏡",
        text: "Mrs. Park next door says, “I saw a cat by my porch!”",
        choices: [["Look under the porch", "porch"], ["Look in her flower pots", "pots"]]
      },
      porch: {
        pic: "🐱💤",
        text: "There’s Milo, fast asleep under the porch! You carry him home.",
        end: true
      },
      pots: {
        pic: "🪴🐱",
        text: "Milo is curled up in a big flower pot! Silly cat!",
        end: true
      }
    }
  },

  beach: {
    title: "Beach Day",
    icon: "🏖️",
    color: "#8FD3FF",
    scenes: {
      start: {
        pic: "🏖️☀️",
        text: "It’s a sunny day at the beach! What do you want to do first?",
        choices: [["Build a sandcastle", "sand"], ["Look for seashells", "shells"], ["Splash in the waves", "swim"]]
      },
      sand: {
        pic: "🪣🏰",
        text: "You fill your bucket with wet sand and build a tall sandcastle.",
        choices: [["Dig a moat around it", "moat"], ["Put shells on top", "decorate"]]
      },
      moat: {
        pic: "🌊🪣",
        text: "You dig a moat. A wave comes and fills it with water! Splash!",
        end: true
      },
      decorate: {
        pic: "🏰🐚",
        text: "You put shells all over the top. Your sandcastle looks amazing!",
        end: true
      },
      shells: {
        pic: "🐚👀",
        text: "You walk by the water looking for shells. Hey, one of them is moving!",
        choices: [["Look closer", "crab"], ["Run and get Dad", "dad"]]
      },
      crab: {
        pic: "🦀",
        text: "It’s a little crab! It walks sideways back into the water. Bye, crab!",
        end: true
      },
      dad: {
        pic: "👨🦀",
        text: "Dad says, “That’s a hermit crab. It lives inside a shell!” So cool!",
        end: true
      },
      swim: {
        pic: "🌊😄",
        text: "You jump over the little waves. Splash! The water is cold!",
        choices: [["Float on your back", "float"], ["Get an ice cream", "icecream"]]
      },
      float: {
        pic: "🌊☁️",
        text: "You float and look at the clouds. One looks like a dog!",
        end: true
      },
      icecream: {
        pic: "🍦😋",
        text: "You get a big ice cream cone. It drips down your hand. Yum!",
        end: true
      }
    }
  },

  baking: {
    title: "Baking with Grandma",
    icon: "🥞",
    color: "#FFB3C9",
    scenes: {
      start: {
        pic: "👵🍳",
        text: "Grandma says, “Let’s bake something today!” What should you make?",
        choices: [["Cookies", "cookies"], ["Pancakes", "pancakes"]]
      },
      cookies: {
        pic: "🥣🥄",
        text: "You mix butter, sugar, and flour. What goes in the cookies?",
        choices: [["Chocolate chips", "chips"], ["Lots of sprinkles", "sprinkles"]]
      },
      chips: {
        pic: "🍪🥛",
        text: "The cookies come out of the oven warm and gooey. Time for milk and cookies!",
        end: true
      },
      sprinkles: {
        pic: "🍪🎉",
        text: "You shake on SO many sprinkles. Some land on the floor! Your cookies are super colorful.",
        end: true
      },
      pancakes: {
        pic: "🥞🍳",
        text: "You stir the batter. Grandma pours it in the pan. Time to flip it!",
        choices: [["Flip it up high", "high"], ["Flip it gently", "gentle"]]
      },
      high: {
        pic: "🥞🐶",
        text: "Whoops! The pancake lands on the floor. The dog gobbles it up!",
        choices: [["Try again, gently", "gentle"]]
      },
      gentle: {
        pic: "🥞🍓",
        text: "Perfect flip! You put strawberries on top and eat it all up.",
        end: true
      }
    }
  },

  farm: {
    title: "Farm Visit",
    icon: "🚜",
    color: "#A8E6A1",
    scenes: {
      start: {
        pic: "🚜🌾",
        text: "You’re visiting a farm! Where do you go first?",
        choices: [["The barn", "barn"], ["The pond", "pond"]]
      },
      barn: {
        pic: "🐄🐐",
        text: "In the barn there’s a cow and a goat. Moo! Baa! What do you do?",
        choices: [["Feed the goat", "goat"], ["Find the chickens", "eggs"]]
      },
      goat: {
        pic: "🐐🥕",
        text: "The goat eats the carrot right out of your hand. It tickles!",
        end: true
      },
      eggs: {
        pic: "🐔🥚",
        text: "You find four eggs in the hen house. One is still warm!",
        end: true
      },
      pond: {
        pic: "🦆💧",
        text: "Ducks are swimming in the pond. Quack, quack!",
        choices: [["Toss some duck food", "food"], ["Count the baby ducks", "count"]]
      },
      food: {
        pic: "🦆🦆🦆",
        text: "The ducks swim over fast! They eat up every last bit.",
        end: true
      },
      count: {
        pic: "🦆🐥🐥🐥",
        text: "One, two, three, four, five baby ducks! They follow their mom in a line.",
        end: true
      }
    }
  },

  snow: {
    title: "Snow Day",
    icon: "⛄",
    color: "#D9D2FF",
    scenes: {
      start: {
        pic: "❄️🏠",
        text: "It snowed last night! No school today! What do you want to do?",
        choices: [["Build a snowman", "snowman"], ["Go sledding", "sled"]]
      },
      snowman: {
        pic: "⛄",
        text: "You roll three big snowballs and stack them up. What does your snowman need?",
        choices: [["A carrot nose", "carrot"], ["A warm scarf", "scarf"]]
      },
      carrot: {
        pic: "⛄🥕",
        text: "You stick in a carrot nose. Your snowman looks so happy!",
        end: true
      },
      scarf: {
        pic: "⛄🧣",
        text: "You wrap your scarf around the snowman. Now he won’t be cold. Ha ha!",
        end: true
      },
      sled: {
        pic: "🛷⛰️",
        text: "You pull your sled to the top of the big hill. Which way do you go?",
        choices: [["The steep, fast side", "fast"], ["The easy, slow side", "slow"]]
      },
      fast: {
        pic: "🛷💨",
        text: "WHOOSH! You zoom down and crash into a big soft pile of snow!",
        choices: [["Go home for hot cocoa", "cocoa"]]
      },
      slow: {
        pic: "🛷😊",
        text: "You glide down nice and slow. You do it ten more times!",
        choices: [["Go home for hot cocoa", "cocoa"]]
      },
      cocoa: {
        pic: "☕🧦",
        text: "You put on fuzzy socks and drink hot cocoa. What a great snow day!",
        end: true
      }
    }
  }
};

const home = document.getElementById("home");
const reader = document.getElementById("reader");
const shelf = document.getElementById("shelf");
const picture = document.getElementById("picture");
const text = document.getElementById("text");
const choices = document.getElementById("choices");
const readBtn = document.getElementById("readBtn");
const backBtn = document.getElementById("backBtn");

let storyId = null;
let sceneId = "start";

function stopTalking() {
  if ("speechSynthesis" in window) window.speechSynthesis.cancel();
}

function speak(words) {
  if (!("speechSynthesis" in window)) return;
  stopTalking();
  const talk = new SpeechSynthesisUtterance(words);
  talk.rate = 0.9;
  talk.pitch = 1.1;
  window.speechSynthesis.speak(talk);
}

function addChoice(label, onClick) {
  const btn = document.createElement("button");
  btn.className = "choice";
  btn.type = "button";
  btn.textContent = label;
  btn.addEventListener("click", () => { stopTalking(); onClick(); });
  choices.appendChild(btn);
}

function showHome() {
  stopTalking();
  reader.hidden = true;
  home.hidden = false;
  window.scrollTo(0, 0);
}

function startStory(id) {
  storyId = id;
  home.hidden = true;
  reader.hidden = false;
  showScene("start");
}

function showScene(id) {
  sceneId = id;
  const scene = stories[storyId].scenes[id];

  picture.textContent = scene.pic;
  picture.classList.remove("pop");
  void picture.offsetWidth; // restart the animation
  picture.classList.add("pop");

  text.textContent = scene.text;

  choices.innerHTML = "";
  if (scene.end) {
    addChoice("🔁 Read it again", () => showScene("start"));
    addChoice("📚 Pick another story", showHome);
  } else {
    scene.choices.forEach(([label, next]) => addChoice(label, () => showScene(next)));
  }
  window.scrollTo(0, 0);
}

// Build the story picker
Object.entries(stories).forEach(([id, story]) => {
  const btn = document.createElement("button");
  btn.className = "book";
  btn.type = "button";
  btn.style.background = story.color;
  btn.innerHTML = `<span class="icon" aria-hidden="true"></span><span class="name"></span>`;
  btn.querySelector(".icon").textContent = story.icon;
  btn.querySelector(".name").textContent = story.title;
  btn.addEventListener("click", () => startStory(id));
  shelf.appendChild(btn);
});

readBtn.addEventListener("click", () => {
  const scene = stories[storyId].scenes[sceneId];
  if (scene.end) {
    speak(scene.text + " ... The end!");
  } else {
    const options = scene.choices.map(c => c[0]).join(", or ");
    speak(scene.text + " ... " + options + "?");
  }
});

backBtn.addEventListener("click", showHome);

if (!("speechSynthesis" in window)) readBtn.hidden = true;
</script>
</body>
</html>
